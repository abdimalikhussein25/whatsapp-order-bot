name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, runtime version, package version
  - type: markdown
    attributes:
      value: "**Security issue?** Please don't open a public issue — see [SECURITY.md](../blob/main/SECURITY.md)."
